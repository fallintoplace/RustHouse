name: Rust benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: rust-bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  benchmark:
    name: Rust benchmarks (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Run verified benchmark suites
        run: python3 -m bench benchmark --rows 65536 --samples 7
      - name: Validate benchmark manifest and measurements
        run: |
          python3 -m bench.validate_benchmark bench/results \
            --rows 65536 --samples 7 --stations 413
      - name: Store benchmark measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rusthouse-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench/results/
          retention-days: 14
