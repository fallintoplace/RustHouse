name: One-time Rustfmt and Windows file-stat probe
on:
  push:
    branches:
      - fix/rusthouse-ci-repair-20261101
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize CI repair changes with rustfmt"
            git push origin HEAD:fix/rusthouse-ci-repair-20261101
          fi
  windows-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect metadata comparison on Windows
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          with TemporaryDirectory() as folder:
              path = Path(folder) / "sample.json"
              path.write_text('{"sample":true}', encoding="utf-8")
              before = path.lstat()
              fd = os.open(path, os.O_RDONLY | getattr(os, "O_BINARY", 0) | getattr(os, "O_NOFOLLOW", 0))
              try:
                  opened = os.fstat(fd)
                  with os.fdopen(fd, "rb", closefd=False) as stream:
                      data = stream.read()
                  after = path.lstat()
              finally:
                  os.close(fd)
              attrs = ("st_mode", "st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns", "st_birthtime_ns")
              for attr in attrs:
                  values = [getattr(obj, attr, None) for obj in (before, opened, after)]
                  print(attr, values, "equal=", values[0] == values[1] == values[2])
              print("bytes=", data)
          PY
