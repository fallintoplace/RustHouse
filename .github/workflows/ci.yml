name: Rust CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 1 * * 0'

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  main-check:
    name: Latest main Linux check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: latest-main
      - name: Check workspace targets
        run: cargo check --workspace --lib --bins --locked

  format:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Rust format (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  lint:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Rust Clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rustdoc:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Rustdoc warnings (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: rustdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build workspace docs without dependencies
        run: cargo doc --workspace --no-deps --locked

  test:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Rust (${{ matrix.os }}, ${{ matrix.shard }} shard)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [query, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests-${{ matrix.os }}-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run all Rust tests in the shard
        shell: bash
        env:
          RUST_TEST_SHARD: ${{ matrix.shard }}
        run: |
          case "$RUST_TEST_SHARD" in
            query)
              cargo test -p rusthouse-query --locked --no-fail-fast
              ;;
            rest)
              cargo test --workspace --exclude rusthouse-query --locked --no-fail-fast
              ;;
            *)
              echo "::error::Unknown Rust test shard: $RUST_TEST_SHARD"
              exit 1
              ;;
          esac
  sql-smoke:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: SQL smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: sql-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the binaries used by SQL smoke
        shell: bash
        env:
          RUNNER_OS_MATRIX: ${{ matrix.os }}
        run: |
          if [ "$RUNNER_OS_MATRIX" = "ubuntu-latest" ]; then
            cargo build --locked -p rusthouse-cli -p rusthouse-server
          else
            cargo build --locked -p rusthouse-cli
          fi
      - name: Verify durable local database product acceptance
        run: python3 -m bench.product_acceptance --binary target/debug/rusthouse
      - name: Verify 20 generated SQL queries
        run: |
          python3 -m bench workload latency -- \
            --binary target/debug/rusthouse \
            --rows 512 --runs 1 --warmups 0
      - name: Verify persisted physical scans against exact references
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m bench workload physical-scan -- \
            --binary target/debug/rusthouse --rows 2048 \
            --runs 1 --warmups 0 --timeout 60
      - name: Verify CLI and HTTP query parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m bench.interop.cli_http_parity \
            --binary target/debug/rusthouse \
            --server target/debug/rusthouse-server
      - name: Verify analytics baseline against SQLite
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m bench workload analytics-suite -- \
            --binary target/debug/rusthouse \
            --workload bench/analytics/workloads/baseline.json \
            --rows 512 --runs 1 --warmups 0 --timeout 60


  windows-smoke:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Windows compile and CLI unit smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Full database integration tests require directory fsync, which is not available via std::fs on Windows.
      - name: Check all targets compile
        run: cargo check --workspace --all-targets --locked
      - name: Run CLI unit tests
        run: cargo test -p rusthouse-cli --bin rusthouse --locked
      - name: Build workspace binaries
        run: cargo build --workspace --locked
      - name: Smoke-test Windows CLI and server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\target\debug\rusthouse-server.exe' --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "rusthouse-server --help failed with exit code $LASTEXITCODE"
          }
          $rows = @(& '.\target\debug\rusthouse.exe' sql 'SELECT number FROM numbers(3) ORDER BY number' --format tsv-no-header)
          if ($LASTEXITCODE -ne 0) {
            throw "rusthouse SQL query failed with exit code $LASTEXITCODE"
          }
          $actual = $rows -join "`n"
          if ($actual -ne "0`n1`n2") {
            throw "Unexpected SQL query output: $actual"
          }

  analytics-harness:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Analytics harness (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test all Python workload harnesses
        run: python -m bench python-tests

  msrv:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Rust MSRV (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum Rust toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test minimum Rust version
        run: cargo test --workspace --locked --no-fail-fast

  integration-gate:
    name: Integration gate
    if: ${{ always() && github.event_name != 'push' && github.ref == 'refs/heads/main' }}
    needs: [format, lint, rustdoc, test, sql-smoke, windows-smoke, analytics-harness, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          FORMAT: ${{ needs.format.result }}
          LINT: ${{ needs.lint.result }}
          RUSTDOC: ${{ needs.rustdoc.result }}
          TEST: ${{ needs.test.result }}
          SQL_SMOKE: ${{ needs.sql-smoke.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
          ANALYTICS: ${{ needs.analytics-harness.result }}
          MSRV: ${{ needs.msrv.result }}
        shell: bash
        run: |
          for result in "$FORMAT" "$LINT" "$RUSTDOC" "$TEST" "$SQL_SMOKE" "$WINDOWS" "$ANALYTICS" "$MSRV"; do
            if [ "$result" != "success" ]; then
              echo "::error::Integration gate blocked: required job concluded $result"
              exit 1
            fi
          done
