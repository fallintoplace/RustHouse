name: Rust benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: rust-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Rust benchmarks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Query execution baseline
        run: cargo bench -p rusthouse-query --bench queries --locked -- --rows 65536 --samples 7
      - name: Sorted frozen-part scans
        run: cargo bench -p rusthouse-query --bench parts --locked -- --rows 65536 --samples 7 --layout sorted --csv > sorted.csv
      - name: Shuffled frozen-part scans
        run: cargo bench -p rusthouse-query --bench parts --locked -- --rows 65536 --samples 7 --layout shuffled --csv > shuffled.csv
      - name: Store scan measurements
        uses: actions/upload-artifact@v4
        with:
          name: rusthouse-part-scans-${{ github.run_id }}
          path: |
            sorted.csv
            shuffled.csv
          retention-days: 14
