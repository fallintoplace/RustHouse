name: Rust benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: rust-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Rust benchmarks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Run verified benchmark suites
        run: python3 -m bench benchmark --rows 65536 --samples 7
      - name: Store benchmark measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rusthouse-benchmarks-${{ github.run_id }}
          path: bench/results/
          retention-days: 14
