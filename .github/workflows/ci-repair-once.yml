name: One-time CI repair formatting
on:
  push:
    branches:
      - fix/rusthouse-ci-repair-20261101
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply machine-fixable Clippy suggestions
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --locked -- -D warnings || true
      - name: Format the workspace
        run: cargo fmt --all
      - name: Commit the generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply workspace rustfmt and Clippy suggestions"
            git push origin HEAD:fix/rusthouse-ci-repair-20261101
          fi
