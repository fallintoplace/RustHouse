name: SQL latency samples

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 0'

permissions:
  contents: read

concurrency:
  group: sql-latency-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated-queries:
    if: github.ref == 'refs/heads/main'
    name: Verified generated SQL latency (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build release CLI
        run: cargo build --release --locked -p rusthouse-cli
      - name: Measure 20 verified SQL queries
        run: |
          python3 -m bench workload latency -- \
            --binary target/release/rusthouse \
            --rows 65536 --runs 5 --warmups 2 \
            --output bench/results/sql-latency.json
      - name: Validate all 20 query results and timing samples
        run: |
          python3 -m bench.latency.validate_report bench/results/sql-latency.json \
            --rows 65536 --runs 5 --warmups 2
      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rusthouse-sql-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench/results/sql-latency.json
          retention-days: 14
