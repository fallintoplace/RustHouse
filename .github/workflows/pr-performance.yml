name: Main SQL performance comparison

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Optional baseline commit SHA (default: parent of main HEAD)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: main-sql-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numbers-sql:
    if: github.ref == 'refs/heads/main'
    name: numbers() SQL baseline vs main (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ inputs.baseline }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose previous main commit if no baseline was supplied
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "BASE_SHA=$(git rev-parse "${HEAD_SHA}^")" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: sql-pr-comparison
          save-if: false
      - name: Benchmark base commit
        shell: bash
        run: |
          git checkout --detach "$BASE_SHA"
          cargo bench -p rusthouse-query --bench queries --locked -- --rows 200000 --samples 21 \
            | tee "$RUNNER_TEMP/rusthouse-base-bench.txt"
          cargo bench -p rusthouse-query --bench grouped --locked -- --rows 65536 --samples 11 \
            | tee "$RUNNER_TEMP/rusthouse-base-grouped.txt"
          cargo bench -p rusthouse-query --bench parts --locked -- --rows 32768 --samples 5 --csv \
            | tee "$RUNNER_TEMP/rusthouse-base-parts.csv"
      - name: Benchmark PR commit
        shell: bash
        run: |
          git checkout --detach "$HEAD_SHA"
          cargo bench -p rusthouse-query --bench queries --locked -- --rows 200000 --samples 21 \
            | tee "$RUNNER_TEMP/rusthouse-pr-bench.txt"
          cargo bench -p rusthouse-query --bench grouped --locked -- --rows 65536 --samples 11 \
            | tee "$RUNNER_TEMP/rusthouse-pr-grouped.txt"
          cargo bench -p rusthouse-query --bench parts --locked -- --rows 32768 --samples 5 --csv \
            | tee "$RUNNER_TEMP/rusthouse-pr-parts.csv"
      - name: Test comparison formatter
        run: python3 -m unittest bench.test_pr_bench_compare bench.test_pr_grouped_compare bench.test_pr_parts_compare
      - name: Show base vs PR numbers in job summary
        shell: bash
        run: |
          python3 -m bench.pr_bench_compare \
            --baseline "$RUNNER_TEMP/rusthouse-base-bench.txt" \
            --candidate "$RUNNER_TEMP/rusthouse-pr-bench.txt" \
            --summary "$RUNNER_TEMP/rusthouse-bench-summary.md"
          cat "$RUNNER_TEMP/rusthouse-bench-summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -m bench.pr_grouped_compare \
            --baseline "$RUNNER_TEMP/rusthouse-base-grouped.txt" \
            --candidate "$RUNNER_TEMP/rusthouse-pr-grouped.txt" \
            --summary "$RUNNER_TEMP/rusthouse-grouped-summary.md"
          cat "$RUNNER_TEMP/rusthouse-grouped-summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -m bench.pr_parts_compare \
            --baseline "$RUNNER_TEMP/rusthouse-base-parts.csv" \
            --candidate "$RUNNER_TEMP/rusthouse-pr-parts.csv" \
            --summary "$RUNNER_TEMP/rusthouse-parts-summary.md"
          cat "$RUNNER_TEMP/rusthouse-parts-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rusthouse-main-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rusthouse-base-bench.txt
            ${{ runner.temp }}/rusthouse-pr-bench.txt
            ${{ runner.temp }}/rusthouse-bench-summary.md
            ${{ runner.temp }}/rusthouse-base-grouped.txt
            ${{ runner.temp }}/rusthouse-pr-grouped.txt
            ${{ runner.temp }}/rusthouse-base-parts.csv
            ${{ runner.temp }}/rusthouse-pr-parts.csv
            ${{ runner.temp }}/rusthouse-parts-summary.md
            ${{ runner.temp }}/rusthouse-grouped-summary.md
          if-no-files-found: warn
          retention-days: 14
