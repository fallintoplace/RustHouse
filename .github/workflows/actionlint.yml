name: GitHub Actions lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Cache actionlint dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: actionlint-${{ runner.os }}-go1.25-v1.7.12
      - name: Require ShellCheck for embedded shell scripts
        run: command -v shellcheck
      - name: Check workflow syntax, expressions and scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck shellcheck -color
